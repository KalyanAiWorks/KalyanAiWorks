        M820 185 Q813 155 823 130 Q830 118 820 100 Q838 115 834 138 Q846 122 838 105 Q852 128 842 158 Q838 175 820 185 Z;
        M820 185 Q810 158 824 128 Q828 115 824 95 Q842 112 836 135 Q850 118 840 102 Q856 125 844 155 Q840 173 820 185 Z;
        M820 185 Q813 155 823 130 Q830 118 820 100 Q838 115 834 138 Q846 122 838 105 Q852 128 842 158 Q838 175 820 185 Z"/>
